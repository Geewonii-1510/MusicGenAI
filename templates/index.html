<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicGenAI – Text to Music</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     SIDEBAR – Lịch sử hội thoại
══════════════════════════════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">🎵</span>
      <span class="logo-text">MusicGenAI</span>
    </div>
    <button class="new-chat-btn" id="newChatBtn" title="Hội thoại mới">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Mới
    </button>
  </div>

  <div class="sidebar-search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Tìm kiếm lịch sử..." />
  </div>

  <div class="history-list" id="historyList">
    <p class="history-empty">Chưa có lịch sử nào</p>
  </div>

  <div class="sidebar-footer">
    <button class="clear-all-btn" id="clearAllBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
      Xóa tất cả lịch sử
    </button>
  </div>
</aside>

<!-- Overlay cho mobile -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ═══════════════════════════════════════════════════════════════════
     MAIN – Khu vực chat chính
══════════════════════════════════════════════════════════════════════ -->
<main class="main" id="main">

  <!-- Top bar -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" title="Mở/đóng sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topbar-title">
      <span id="chatTitle">MusicGenAI</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="newChatTopBtn" title="Hội thoại mới">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Chat messages -->
  <div class="chat-wrapper" id="chatWrapper">
    <!-- Welcome screen -->
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-icon">🎵</div>
      <h1 class="welcome-title">MusicGenAI</h1>
      <p class="welcome-subtitle">Mô tả loại nhạc bạn muốn tạo và AI sẽ tự động sinh ra bản nhạc cho bạn</p>
      <div class="example-prompts">
        <p class="example-label">Thử với:</p>
        <div class="example-grid">
          <button class="example-chip" data-prompt="Tạo một bản nhạc vui vẻ và sôi động phù hợp cho buổi sáng">
            🌅 Nhạc buổi sáng vui vẻ
          </button>
          <button class="example-chip" data-prompt="Tôi muốn nghe nhạc nhẹ nhàng, thư giãn để học bài">
            📚 Nhạc học bài nhẹ nhàng
          </button>
          <button class="example-chip" data-prompt="Tạo nhạc nền epic cho một trận chiến hành động">
            ⚔️ Nhạc epic hành động
          </button>
          <button class="example-chip" data-prompt="Nhạc jazz buồn về một đêm mưa thành phố">
            🌧️ Jazz buồn đêm mưa
          </button>
        </div>
      </div>
    </div>

    <!-- Messages container -->
    <div class="messages" id="messages"></div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <div class="input-container">
      <textarea
        id="promptInput"
        placeholder="Mô tả nhạc bạn muốn tạo... (Enter để gửi, Shift+Enter để xuống dòng)"
        rows="1"
        maxlength="500"
      ></textarea>
      <div class="input-actions">
        <span class="char-count" id="charCount">0/500</span>
        <button class="send-btn" id="sendBtn" title="Gửi (Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="input-hint">MusicGenAI có thể mắc lỗi. Hãy kiểm tra các kết quả quan trọng.</p>
  </div>

</main>

<!-- ═══════════════════════════════════════════════════════════════════
     MODAL – Xác nhận xóa
══════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">🗑️</div>
    <h3 class="modal-title" id="modalTitle">Xác nhận xóa</h3>
    <p class="modal-msg" id="modalMsg">Bạn có chắc muốn xóa?</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">Hủy</button>
      <button class="modal-confirm" id="modalConfirm">Xóa</button>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
